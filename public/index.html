<body>
  <script>
    // Apply the saved (or OS) theme before first paint so there is no
    // light-to-dark flash. useTheme.js takes over once React mounts.
    (function () {
      try {
        var saved = localStorage.getItem("umer-theme");
        var dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = dark ? "#080808" : "#ffffff";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
