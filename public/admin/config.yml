# ============================================================================
# Decap CMS configuration
#
# Every field below maps to a file in src/content/. Saving in the admin UI
# commits to this repo, and Vercel redeploys automatically — no backend and
# no database anywhere in the loop.
#
# When adding an icon option, add the same name to src/components/icons.js
# or it will fall back to a generic icon.
# ============================================================================

backend:
  name: github
  repo: 7umer/portfolio
  branch: main
  base_url: https://umer-badal-portfolio.vercel.app
  auth_endpoint: api/auth

# `npx decap-server` + this flag lets you edit content on localhost without
# logging in. Harmless in production: it only activates on localhost.
local_backend: true

media_folder: public/images/projects
public_folder: /images/projects

publish_mode: simple

collections:
  # --------------------------------------------------------------------------
  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    extension: json
    format: json
    create: true
    slug: "{{fields.title | slugify}}"
    summary: "{{title}} — {{tag}}"
    sortable_fields: [order, title, year]
    fields:
      - { name: title, label: Project name, widget: string }
      - name: track
        label: Show under
        widget: select
        options:
          - { label: Developer, value: developer }
          - { label: Designer, value: designer }
        default: designer
      - { name: tag, label: Category line, widget: string, hint: "Shown above the title, e.g. 'Client Website · Fitness'" }
      - { name: year, label: Year, widget: string, required: false }
      - { name: desc, label: Description, widget: text }
      - name: stack
        label: Tech stack
        widget: list
        summary: "{{fields.tech}}"
        field: { name: tech, label: Technology, widget: string }
      - { name: url, label: Live URL, widget: string, required: false }
      - name: image
        label: Screenshot
        widget: image
        required: false
        hint: "Any size — it is compressed automatically when the site builds."
      - { name: order, label: Sort order, widget: number, value_type: int, default: 99, hint: "Lower numbers appear first." }
      - { name: featured, label: Featured, widget: boolean, default: false, required: false }

  # --------------------------------------------------------------------------
  - name: settings
    label: Site content
    files:
      - name: site
        label: Profile, resume & contact
        file: src/content/site.json
        fields:
          - { name: name, label: Full name, widget: string }
          - { name: shortName, label: Short name, widget: string }
          - { name: logo, label: Logo text, widget: string }
          - { name: availability, label: Availability badge, widget: string }
          - name: roles
            label: Rotating job titles
            widget: list
            field: { name: role, label: Role, widget: string }
          - { name: headline, label: Hero headline, widget: text }
          - { name: subheadline, label: Hero subheadline, widget: text }
          # A leading slash makes these relative to the repo root rather than
          # to src/content/, which is where this file lives.
          - { name: photo, label: Photo, widget: image, media_folder: "/public/images", public_folder: "/images" }
          - { name: resume, label: Resume PDF, widget: file, media_folder: "/public", public_folder: "/" }
          - { name: email, label: Email, widget: string }
          - { name: phone, label: Phone (display), widget: string }
          - { name: phoneHref, label: Phone (link), widget: string, hint: "Format: tel:+919035477754" }
          - name: company
            label: Company
            widget: object
            fields:
              - { name: name, label: Name, widget: string }
              - { name: url, label: URL, widget: string }
          - name: socials
            label: Social links
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: Label, widget: string }
              - { name: url, label: URL, widget: string }
          - { name: about, label: About paragraph, widget: text }
          - name: roleTags
            label: Role tags
            widget: list
            field: { name: tag, label: Tag, widget: string }
          - name: stats
            label: Stat counters
            widget: list
            summary: "{{fields.value}}{{fields.suffix}} {{fields.label}}"
            fields:
              - { name: label, label: Label, widget: string }
              - { name: value, label: Number, widget: number, value_type: int }
              - { name: suffix, label: Suffix, widget: string, default: "+" }
          - name: cta
            label: Contact section
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }

      - name: services
        label: Services
        file: src/content/services.json
        fields:
          - name: items
            label: Services
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: desc, label: Description, widget: string }
              - name: icon
                label: Icon
                widget: select
                options:
                  - Palette
                  - Code2
                  - LayoutTemplate
                  - Building2
                  - Stethoscope
                  - Home
                  - Rocket
                  - Server
                  - LayoutDashboard
                  - Smartphone
                  - Gauge
                  - Sparkles
                default: Sparkles

      - name: skills
        label: Toolkit
        file: src/content/skills.json
        fields:
          - name: categories
            label: Categories
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Category, widget: string }
              - name: skills
                label: Skills
                widget: list
                field: { name: skill, label: Skill, widget: string }

      - name: experience
        label: Experience
        file: src/content/experience.json
        fields:
          - name: items
            label: Roles
            widget: list
            summary: "{{fields.role}} — {{fields.org}}"
            fields:
              - { name: role, label: Role, widget: string }
              - { name: org, label: Organisation, widget: string }
              - { name: period, label: Period, widget: string }
              - { name: desc, label: Description, widget: text }

      - name: testimonials
        label: Testimonials
        file: src/content/testimonials.json
        fields:
          - name: items
            label: Testimonials
            widget: list
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { name: quote, label: Quote, widget: text }
              - { name: name, label: Name, widget: string }
              - { name: role, label: Role / company, widget: string }

      - name: process
        label: Process & reasons
        file: src/content/process.json
        fields:
          - name: steps
            label: Process steps
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: desc, label: Description, widget: string }
          - name: reasons
            label: Why work with me
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - name: icon
                label: Icon
                widget: select
                options:
                  - Zap
                  - Sparkles
                  - Search
                  - Smartphone
                  - Target
                  - Gem
                  - Layers
                  - Wallet
                default: Sparkles
